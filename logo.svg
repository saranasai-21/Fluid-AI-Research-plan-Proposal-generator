<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fluidFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="#0B1120" stroke="url(#fluidFlow)" stroke-width="3"/>
  <!-- Fluid Dynamic S-Curve Waves -->
  <path d="M 28 62 C 32 45 42 32 58 32 C 72 32 76 40 72 48 C 68 56 56 64 46 64 C 36 64 34 56 40 50" 
        stroke="url(#fluidFlow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="60" cy="38" r="4.5" fill="#38BDF8"/>
  <circle cx="36" cy="56" r="3.5" fill="#EC4899"/>
</svg>

